<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="stylesheet" href="styles.css" />

  <head>
    ...
    <link rel="stylesheet" href="styles.css" />
    <style>
      form.contact {
        background: #ffffff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }

      form.contact label {
        font-size: 14px;
        color: #333;
        margin-bottom: 6px;
        display: block;
      }

      form.contact input,
      form.contact textarea {
        border: 1px solid #ddd;
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        background: #f9f9f9;
        transition: all 0.2s ease;
      }

      form.contact input:focus,
      form.contact textarea:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        outline: none;
      }

      form.contact button {
        background: #4f46e5;
        color: white;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      form.contact button:hover {
        background: #3730a3;
        transform: scale(1.05);
      }

      form.contact .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      @media (max-width: 600px) {
        form.contact .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>


</head>

<body>
  <header>
    <div class="nav-inner">
      <a class="brand" href="index.html">Ahmet</a>
      <nav class="desktop">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
      <button class="mobile-toggle" id="menuBtn">☰</button>
    </div>
    <div id="mobileMenu" class="mobile-menu">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </div>
  </header>

  <main class="wrap contact-main">
    <h1 id="contact-form">Contact Me</h1>

    <form action="https://api.web3forms.com/submit" method="POST" class="contact">
      <input type="hidden" name="access_key" value="1487bb27-6472-4d73-9845-772cd80a028c" />

      <div class="row">
        <div>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <div class="center">
        <button type="submit" class="btn">Send</button>
      </div>
    </form>
  </main>

  <footer>
    <div class="footer-inner">© Ahmet — Portfolio 2025</div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
