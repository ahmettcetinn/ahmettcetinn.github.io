<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .quiz-container {
            width: 600px;
            max-width: 90%;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            cursor: pointer;
            background: #222;
            color: #f0f0f0;
            transition: background 0.2s;
        }

        .options button:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <div class="quiz-container">
        <div class="top-bar">
            <div id="score">Score: 0</div>
            <div id="timer">Time: 60</div>
        </div>
        <div class="question" id="question">Loading...</div>
        <div class="options" id="options"></div>
    </div>

    <script>
        const questions = {
            general: [
                { q: "What is the capital of France?", options: ["Berlin", "Paris", "Rome", "Madrid"], answer: 1 },
                { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], answer: 1 },
                { q: "Which language is primarily spoken in Brazil?", options: ["Spanish", "Portuguese", "French", "English"], answer: 1 },
                { q: "What color do you get by mixing red and white?", options: ["Pink", "Purple", "Orange", "Brown"], answer: 0 },
                { q: "Which animal is known as the King of the Jungle?", options: ["Tiger", "Elephant", "Lion", "Bear"], answer: 2 },
                { q: "How many continents are there?", options: ["5", "6", "7", "8"], answer: 2 },
                { q: "What is the smallest prime number?", options: ["0", "1", "2", "3"], answer: 2 },
                { q: "Which ocean is the largest?", options: ["Atlantic", "Indian", "Pacific", "Arctic"], answer: 2 },
                { q: "Which day comes after Monday?", options: ["Tuesday", "Wednesday", "Thursday", "Friday"], answer: 0 },
                { q: "What is 10 + 15?", options: ["20", "25", "30", "35"], answer: 1 },
            ],
            science: [
                { q: "What is H2O commonly known as?", options: ["Oxygen", "Hydrogen", "Water", "Helium"], answer: 2 },
                { q: "What gas do plants produce during photosynthesis?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Methane"], answer: 0 },
                { q: "What planet is closest to the sun?", options: ["Mercury", "Venus", "Earth", "Mars"], answer: 0 },
                { q: "What is the chemical symbol for gold?", options: ["Au", "Ag", "Gd", "Go"], answer: 0 },
                { q: "What part of the body pumps blood?", options: ["Liver", "Heart", "Lungs", "Kidney"], answer: 1 },
                { q: "Which organ is responsible for breathing?", options: ["Lungs", "Brain", "Stomach", "Skin"], answer: 0 },
                { q: "What is the speed of light?", options: ["300,000 km/s", "150,000 km/s", "1,000 km/s", "30,000 km/s"], answer: 0 },
                { q: "Which gas is essential for respiration?", options: ["Oxygen", "Carbon Dioxide", "Nitrogen", "Hydrogen"], answer: 0 },
                { q: "What is the human body's largest organ?", options: ["Skin", "Liver", "Heart", "Lungs"], answer: 0 },
                { q: "Which particle has a negative charge?", options: ["Proton", "Neutron", "Electron", "Photon"], answer: 2 },
            ],
            history: [
                { q: "Who was the first President of the United States?", options: ["Lincoln", "Washington", "Jefferson", "Adams"], answer: 1 },
                { q: "In which year did World War II end?", options: ["1940", "1945", "1950", "1939"], answer: 1 },
                { q: "Who discovered America?", options: ["Columbus", "Magellan", "Cook", "Vespucci"], answer: 0 },
                { q: "Which empire was led by Julius Caesar?", options: ["Greek", "Roman", "Egyptian", "Persian"], answer: 1 },
                { q: "The Great Fire of London happened in which year?", options: ["1666", "1566", "1766", "1866"], answer: 0 },
                { q: "Who was known as the Maid of Orléans?", options: ["Marie Curie", "Joan of Arc", "Catherine the Great", "Cleopatra"], answer: 1 },
                { q: "Which wall divided Berlin?", options: ["Great Wall", "Berlin Wall", "Hadrian's Wall", "Western Wall"], answer: 1 },
                { q: "Who was the first man on the moon?", options: ["Yuri Gagarin", "Neil Armstrong", "Buzz Aldrin", "Michael Collins"], answer: 1 },
                { q: "Which revolution began in 1789?", options: ["French Revolution", "American Revolution", "Russian Revolution", "Industrial Revolution"], answer: 0 },
                { q: "Who was Pharaoh of Egypt known for building pyramids?", options: ["Tutankhamun", "Ramses II", "Cleopatra", "Khufu"], answer: 3 },
            ]
        };

        let category = localStorage.getItem("quizCategory") || "general";
        let quizData = questions[category];

        // Shuffle and select 8 questions
        quizData = quizData.sort(() => Math.random() - 0.5).slice(0, 8);

        let current = 0;
        let score = 0;
        let time = 60;

        const questionEl = document.getElementById("question");
        const optionsEl = document.getElementById("options");
        const scoreEl = document.getElementById("score");
        const timerEl = document.getElementById("timer");

        function loadQuestion() {
            if (current >= quizData.length) {
                localStorage.setItem("quizScore", score);
                window.location.href = "project3.2.html";
                return;
            }
            let q = quizData[current];
            questionEl.textContent = q.q;
            optionsEl.innerHTML = "";
            q.options.forEach((opt, i) => {
                let btn = document.createElement("button");
                btn.textContent = opt;
                btn.onclick = () => {
                    if (i === q.answer) score++;
                    scoreEl.textContent = "Score: " + score;
                    current++;
                    loadQuestion();
                };
                optionsEl.appendChild(btn);
            });
        }

        function startTimer() {
            let countdown = setInterval(() => {
                time--;
                timerEl.textContent = "Time: " + time;
                if (time <= 0) {
                    clearInterval(countdown);
                    localStorage.setItem("quizScore", score);
                    window.location.href = "project3.2.html";
                }
            }, 1000);
        }

        loadQuestion();
        startTimer();
    </script>
</body>

</html>
