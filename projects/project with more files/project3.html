<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Website</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 2px;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            background: #222;
            color: #f0f0f0;
            transition: background 0.2s;
        }

        button:hover {
            background: #333;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            z-index: 1000;
            /* stays on top of everything */
        }

        .back-btn:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <a href="../../projects.html" class="back-btn">← Back to Projects</a>


    <div class="container">
        <h1>Select Quiz Category</h1>
        <button onclick="startQuiz('general')">General Knowledge</button>
        <button onclick="startQuiz('science')">Science</button>
        <button onclick="startQuiz('history')">History</button>
    </div>

    <script>
        function startQuiz(category) {
            localStorage.setItem("quizCategory", category);
            window.location.href = "project3.1.html";
        }
    </script>
</body>

</html>
