<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            min-height: 100vh;
        }

        .todo-container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            position: relative;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 2rem;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        .input-container {
            display: flex;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px 0 0 4px;
            font-size: 1rem;
            outline: none;
            background: #222;
            color: #f0f0f0;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #222;
            color: #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 0 4px 4px 0;
        }

        button:hover {
            background: #333;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
            transition: all 0.2s;
        }

        li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        li span {
            cursor: pointer;
            flex: 1;
            margin-right: 10px;
        }

        li button {
            background: #222;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-left: 5px;
        }

        li button:hover {
            background: #333;
        }

        #info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        /* Modal styles */
        #editModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #editModal .modal-content {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #editModal input[type="text"] {
            width: 100%;
            max-width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #222;
            color: #f0f0f0;
            font-size: 1rem;
            box-sizing: border-box;
        }

        #editModal button {
            width: 100px;
            border-radius: 4px;
            padding: 8px;
        }

        #editModal div.buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            z-index: 1000;
            /* stays on top of everything */
        }

        .back-btn:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <a href="../projects.html" class="back-btn">← Back to Projects</a>

    <div class="todo-container">
        <h1>To-Do List</h1>
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button onclick="addTask()">Add</button>
        </div>
        <ul id="taskList"></ul>
        <div id="info">
            Click task to complete, Edit to modify, Delete to remove. Completed tasks move to the top.
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal">
        <div class="modal-content">
            <h3>Edit Task</h3>
            <input type="text" id="editInput" placeholder="Edit your task">
            <div class="buttons">
                <button onclick="saveEdit()">Save</button>
                <button onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        let editIndex = null;

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function renderTasks() {
            const list = document.getElementById("taskList");
            list.innerHTML = "";

            // Move completed tasks to the top
            const sortedTasks = [...tasks].sort((a, b) => b.completed - a.completed);

            sortedTasks.forEach((task, index) => {
                const li = document.createElement("li");
                li.className = task.completed ? "completed" : "";

                const span = document.createElement("span");
                span.textContent = task.text;
                span.onclick = () => {
                    const originalIndex = tasks.indexOf(task);
                    tasks[originalIndex].completed = !tasks[originalIndex].completed;
                    saveTasks();
                    renderTasks();
                };

                const editBtn = document.createElement("button");
                editBtn.textContent = "Edit";
                editBtn.onclick = () => openModal(tasks.indexOf(task));

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.onclick = () => {
                    const confirmed = confirm("Are you sure you want to delete this task?");
                    if (confirmed) {
                        const originalIndex = tasks.indexOf(task);
                        tasks.splice(originalIndex, 1);
                        saveTasks();
                        renderTasks();
                    }
                };

                li.appendChild(span);
                li.appendChild(editBtn);
                li.appendChild(deleteBtn);
                list.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById("taskInput");
            const text = input.value.trim();
            if (text !== "") {
                tasks.push({ text: text, completed: false });
                saveTasks();
                renderTasks();
                input.value = "";
            }
        }

        // Modal functions
        function openModal(index) {
            editIndex = index;
            const modal = document.getElementById("editModal");
            modal.style.display = "flex";
            document.getElementById("editInput").value = tasks[index].text;
        }

        function closeModal() {
            document.getElementById("editModal").style.display = "none";
            editIndex = null;
        }

        function saveEdit() {
            const newText = document.getElementById("editInput").value.trim();
            if (newText !== "" && editIndex !== null) {
                tasks[editIndex].text = newText;
                saveTasks();
                renderTasks();
                closeModal();
            }
        }

        // Initial render
        renderTasks();

        // Close modal when clicking outside
        window.onclick = function (e) {
            const modal = document.getElementById("editModal");
            if (e.target === modal) closeModal();
        }
    </script>
</body>

</html>
