<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            min-height: 100vh;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            z-index: 1000;
        }

        .back-btn:hover {
            background: #555;
        }

        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            width: 360px;
            text-align: center;
        }

        h1 {
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        input,
        select {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            border: none;
            background: #222;
            color: #f0f0f0;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #222;
            color: #f0f0f0;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            margin: 5px;
        }

        button:hover {
            background: #333;
        }

        #result {
            margin-top: 20px;
            font-size: 1.2rem;
            word-wrap: break-word;
        }

        @media (max-width: 400px) {
            .container {
                width: 90%;
                padding: 20px;
            }

            input,
            select {
                width: 90%;
            }

            button {
                width: 45%;
                margin: 5px 2%;
            }
        }
    </style>
</head>

<body>

    <a href="../projects.html" class="back-btn">← Back to Projects</a>

    <div class="container">
        <h1>Temperature Converter</h1>

        <input type="number" id="temp" placeholder="Enter temperature">
        <select id="unit">
            <option value="C">Celsius</option>
            <option value="F">Fahrenheit</option>
            <option value="K">Kelvin</option>
        </select>

        <div id="result">-</div>
    </div>

    <script>
        const tempInput = document.getElementById("temp");
        const unitSelect = document.getElementById("unit");
        const resultDiv = document.getElementById("result");

        tempInput.addEventListener("input", updateConversion);
        unitSelect.addEventListener("change", updateConversion);

        function updateConversion() {
            const temp = parseFloat(tempInput.value);
            const unit = unitSelect.value;

            if (isNaN(temp)) {
                resultDiv.textContent = "Enter a valid number!";
                return;
            }

            let c, f, k;

            switch (unit) {
                case "C":
                    c = temp;
                    f = (temp * 9 / 5 + 32).toFixed(1);
                    k = (temp + 273.15).toFixed(1);
                    break;
                case "F":
                    c = ((temp - 32) * 5 / 9).toFixed(1);
                    f = temp;
                    k = ((temp - 32) * 5 / 9 + 273.15).toFixed(1);
                    break;
                case "K":
                    c = (temp - 273.15).toFixed(1);
                    f = ((temp - 273.15) * 9 / 5 + 32).toFixed(1);
                    k = temp;
                    break;
            }

            resultDiv.innerHTML = `
        Celsius: <strong>${c}°C</strong><br>
        Fahrenheit: <strong>${f}°F</strong><br>
        Kelvin: <strong>${k}K</strong>
    `;
        }
    </script>

</body>

</html>
