<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background 1s;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            z-index: 1000;
        }

        .back-btn:hover {
            background: #555;
        }

        .container {
            background: #1a1a1a;
            padding: 40px 30px;
            border-radius: 8px;
            text-align: center;
            width: 350px;
        }

        h1 {
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        #clock {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #date {
            margin-top: 10px;
            font-size: 1.2rem;
        }

        #controls {
            margin-top: 15px;
        }

        select,
        button {
            padding: 8px 12px;
            margin: 5px;
            border-radius: 4px;
            border: none;
            background: #222;
            color: #f0f0f0;
            cursor: pointer;
        }

        select:focus,
        button:focus {
            outline: none;
        }

        button:hover,
        select:hover {
            background: #333;
        }

        @media (max-width: 400px) {
            .container {
                width: 90%;
                padding: 30px;
            }

            #clock {
                font-size: 2.5rem;
            }

            #date {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <a href="../projects.html" class="back-btn">← Back to Projects</a>

    <div class="container">
        <h1>Digital Clock</h1>
        <div id="clock">00:00:00</div>
        <div id="date">-- -- ----</div>

        <div id="controls">
            <button id="toggleFormat">Switch to 12h</button>
            <select id="timezone">
                <option value="local">Local Time</option>
                <option value="UTC">UTC</option>
                <option value="America/New_York">New York</option>
                <option value="Europe/London">London</option>
                <option value="Asia/Tokyo">Tokyo</option>
                <option value="Australia/Sydney">Sydney</option>
            </select>
        </div>
    </div>

    <script>
        let use24Hour = true;
        const clock = document.getElementById("clock");
        const dateDiv = document.getElementById("date");
        const toggleBtn = document.getElementById("toggleFormat");
        const timezoneSelect = document.getElementById("timezone");

        let showColon = true;

        toggleBtn.addEventListener("click", () => {
            use24Hour = !use24Hour;
            toggleBtn.textContent = use24Hour ? "Switch to 12h" : "Switch to 24h";
        });

        function updateClock() {
            const tz = timezoneSelect.value;
            const now = tz === "local" ? new Date() : new Date(new Date().toLocaleString("en-US", { timeZone: tz }));

            let h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();

            let ampm = '';
            if (!use24Hour) {
                ampm = h >= 12 ? " PM" : " AM";
                h = h % 12 || 12;
            }

            const colon = showColon ? ":" : " ";
            showColon = !showColon;

            clock.textContent = `${String(h).padStart(2, '0')}${colon}${String(m).padStart(2, '0')}${colon}${String(s).padStart(2, '0')}${ampm}`;

            const day = now.getDate();
            const month = now.toLocaleString('default', { month: 'long' });
            const year = now.getFullYear();
            dateDiv.textContent = `${day} ${month} ${year}`;

            let hour = now.getHours();
            let bgColor = "#111";
            if (hour >= 6 && hour < 12) bgColor = "#2e3a59";
            else if (hour >= 12 && hour < 18) bgColor = "#445c72";
            else if (hour >= 18 && hour < 21) bgColor = "#2a2a40";
            else bgColor = "#111";

            document.body.style.background = bgColor;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>

</html>
