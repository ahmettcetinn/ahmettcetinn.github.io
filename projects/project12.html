<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            min-height: 100vh;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            z-index: 1000;
        }

        .back-btn:hover {
            background: #555;
        }

        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            width: 380px;
            text-align: center;
        }

        h1 {
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            width: 60px;
            padding: 8px;
            margin: 10px 0;
            border-radius: 4px;
            border: none;
            background: #222;
            color: #f0f0f0;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        label {
            display: block;
            margin: 5px 0;
            cursor: pointer;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #222;
            color: #f0f0f0;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            margin: 5px;
        }

        button:hover {
            background: #333;
        }

        #passwordDisplay {
            margin-top: 20px;
            font-size: 1.2rem;
            word-break: break-all;
            background: #222;
            padding: 10px;
            border-radius: 4px;
        }

        #strength {
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .container {
                width: 90%;
                padding: 20px;
            }

            button {
                width: 45%;
                margin: 5px 2%;
            }

            input[type="number"] {
                width: 50px;
            }
        }
    </style>
</head>

<body>

    <a href="../projects.html" class="back-btn">← Back to Projects</a>

    <div class="container">
        <h1>Password Generator</h1>

        <label>
            Length: <input type="number" id="length" min="4" max="32" value="12">
        </label>

        <label><input type="checkbox" id="uppercase" checked> Include Uppercase</label>
        <label><input type="checkbox" id="lowercase" checked> Include Lowercase</label>
        <label><input type="checkbox" id="numbers" checked> Include Numbers</label>
        <label><input type="checkbox" id="symbols" checked> Include Symbols</label>

        <div>
            <button onclick="generatePassword()">Generate</button>
            <button onclick="copyPassword()">Copy</button>
        </div>

        <div id="passwordDisplay">-</div>
        <div id="strength">Strength: -</div>
    </div>

    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById("length").value);
            const upper = document.getElementById("uppercase").checked;
            const lower = document.getElementById("lowercase").checked;
            const numbers = document.getElementById("numbers").checked;
            const symbols = document.getElementById("symbols").checked;

            if (!upper && !lower && !numbers && !symbols) {
                alert("Select at least one character type!");
                return;
            }

            const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lowerChars = "abcdefghijklmnopqrstuvwxyz";
            const numberChars = "0123456789";
            const symbolChars = "!@#$%^&*()-_=+[]{}|;:,.<>?/~";

            let charPool = "";
            if (upper) charPool += upperChars;
            if (lower) charPool += lowerChars;
            if (numbers) charPool += numberChars;
            if (symbols) charPool += symbolChars;

            let password = "";
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charPool.length);
                password += charPool[randomIndex];
            }

            document.getElementById("passwordDisplay").textContent = password;
            updateStrength(password, upper, lower, numbers, symbols);
        }

        function copyPassword() {
            const password = document.getElementById("passwordDisplay").textContent;
            if (password && password !== "-") {
                navigator.clipboard.writeText(password);
                alert("Password copied to clipboard!");
            }
        }

        function updateStrength(password, upper, lower, numbers, symbols) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if ([upper, lower, numbers, symbols].filter(Boolean).length >= 3) score++;
            if (password.length >= 16 && [upper, lower, numbers, symbols].filter(Boolean).length === 4) score++;

            let strengthText = "";
            let color = "";
            switch (score) {
                case 0: case 1: strengthText = "Weak"; color = "#F44336"; break;
                case 2: strengthText = "Medium"; color = "#FFC107"; break;
                case 3: strengthText = "Strong"; color = "#4CAF50"; break;
                case 4: strengthText = "Very Strong"; color = "#00E676"; break;
            }
            const strengthDiv = document.getElementById("strength");
            strengthDiv.textContent = "Strength: " + strengthText;
            strengthDiv.style.color = color;
        }
    </script>

</body>

</html>
