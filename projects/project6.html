<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>global celebrations Countdown</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 10px;
            min-height: 100vh;
        }

        .countdown-container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }

        .events {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .event {
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #222;
        }

        .event h2 {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f0f0f0;
        }

        @media(max-width: 1200px) {
            .events {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {
            .events {
                grid-template-columns: 1fr;
            }

            .timer {
                font-size: 1rem;
            }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            z-index: 1000;
        }

        .back-btn:hover {
            background: #555;
        }
    </style>
</head>

<body>

    <a href="../projects.html" class="back-btn">← Back to Projects</a>

    <div class="countdown-container">
        <h1>global celebrations Countdown</h1>
        <div class="events" id="eventsContainer"></div>
    </div>

    <script>
        const eventsList = [
            { name: "New Year's Day", date: "January 1" },
            { name: "Chinese New Year", date: "February 10" },
            { name: "Valentine's Day", date: "February 14" },
            { name: "International Women's Day", date: "March 8" },
            { name: "Holi (Festival of Colors)", date: "March 25" },
            { name: "April Fool's Day", date: "April 1" },
            { name: "Easter Sunday", date: "April 9" },
            { name: "Earth Day", date: "April 22" },
            { name: "Labor Day (International)", date: "May 1" },
            { name: "Mother's Day", date: "May 14" },
            { name: "Father's Day", date: "June 18" },
            { name: "Halloween", date: "October 31" },
            { name: "Diwali", date: "November 1" },
            { name: "Guy Fawkes Night", date: "November 5" },
            { name: "Thanksgiving (USA)", date: "November 28" },
            { name: "International Day of Peace", date: "September 21" },
            { name: "Hanukkah", date: "December 7" },
            { name: "Christmas Day", date: "December 25" },
            { name: "Boxing Day", date: "December 26" },
            { name: "New Year's Eve", date: "December 31" }
        ];



        const eventsContainer = document.getElementById("eventsContainer");

        eventsList.forEach((event, index) => {
            const div = document.createElement("div");
            div.className = "event";
            div.innerHTML = `<h2>${event.name} (${event.date})</h2><div class="timer" id="timer-${index}"></div>`;
            eventsContainer.appendChild(div);
        });

        function updateCountdowns() {
            const now = new Date();
            eventsList.forEach((event, index) => {
                const currentYear = now.getFullYear();
                let targetDate = new Date(`${event.date}, ${currentYear} 00:00:00`);

                if (targetDate < now) targetDate = new Date(`${event.date}, ${currentYear + 1} 00:00:00`);

                const diff = targetDate - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / (1000 * 60)) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById(`timer-${index}`).textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            });
        }

        setInterval(updateCountdowns, 1000);
        updateCountdowns();
    </script>
</body>

</html>
