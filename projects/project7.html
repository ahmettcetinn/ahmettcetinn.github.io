<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
            min-height: 100vh;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            background: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            z-index: 1000;
        }

        .back-btn:hover {
            background: #555;
        }

        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            width: 350px;
            text-align: center;
        }

        h1 {
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #222;
            color: #f0f0f0;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background: #333;
        }

        #diceResult {
            font-size: 3rem;
            margin-top: 30px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <a href="../projects.html" class="back-btn">← Back to Projects</a>

    <div class="container">
        <h1>Dice Roller</h1>
        <button onclick="rollDice()">Roll Dice 🎲</button>
        <div id="diceResult">-</div>
    </div>

    <script>
        function rollDice() {
            const display = document.getElementById("diceResult");
            let rolls = [];
            for (let i = 0; i < 20; i++) {
                rolls.push(Math.floor(Math.random() * 6) + 1);
            }

            let i = 0;
            const interval = setInterval(() => {
                display.textContent = rolls[i];
                i++;
                if (i >= rolls.length) {
                    clearInterval(interval);
                    let final = Math.floor(Math.random() * 6) + 1;
                    let slowRoll = 0;
                    const slowInterval = setInterval(() => {
                        display.textContent = Math.floor(Math.random() * 6) + 1;
                        slowRoll++;
                        if (slowRoll > 15) {
                            clearInterval(slowInterval);
                            display.textContent = `You rolled: ${final}`;
                        }
                    }, 100 + slowRoll * 20);
                }
            }, 50);
        }
    </script>
</body>

</html>
